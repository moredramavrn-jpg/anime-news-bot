name: Anime News Bot

on:
  schedule:
    - cron: '7,37 * * * *'   # каждые 5 минут (для теста)
  workflow_dispatch:         # ручной запуск

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # полная история для корректного rebase

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser pyTelegramBotAPI requests beautifulsoup4 lxml yt-dlp

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GIGACHAT_AUTHORIZATION_KEY: ${{ secrets.GIGACHAT_AUTHORIZATION_KEY }}
        run: python bot.py

      - name: Commit posted.txt if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add posted.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update posted.txt"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
