name: Anime Quiz

on:
  workflow_dispatch:
  # Если у тебя тут была строка расписания (schedule/cron), можешь вернуть её сюда

permissions:
  contents: write

jobs:
  quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Быстрая установка ffmpeg за пару секунд
      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install Python dependencies
        run: pip install requests pyTelegramBotAPI

      - name: Run anime_quiz.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GIGACHAT_AUTHORIZATION_KEY: ${{ secrets.GIGACHAT_AUTHORIZATION_KEY }}
        run: python anime_quiz.py

      - name: Commit and push state
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add last_quiz_type.txt last_media_type.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Авто-сохранение памяти бота"
          git push
