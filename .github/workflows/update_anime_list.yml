name: Update Top Anime List

on:
  schedule:
    - cron: '0 3 * * 1'   # каждый понедельник в 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # для корректного pull --rebase

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch top anime
        run: python fetch_top_anime.py

      - name: Commit updated lists
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add top_anime.txt popular_anime.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update anime lists"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
